name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Get version from tag
        id: get_version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Downlink ${{ steps.get_version.outputs.tag }}"
          body: |
            ## Downlink ${{ steps.get_version.outputs.tag }}

            ### Downloads
            - **macOS**: Download the `.dmg` file for your architecture (arm64 for M1/M2/M3, x64 for Intel)
            - **Windows**: Download the `.exe` installer or `.msi` file
            - **Linux**: Download the `.deb`, `.rpm`, or `.AppImage` file

            ### What's included
            - yt-dlp and ffmpeg are bundled - no separate installation required!

            ### Auto-Updates
            Downlink now supports automatic updates! You'll be notified when a new version is available.

            ### Changelog
            See the [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.get_version.outputs.tag }}) for changes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
            binary_suffix: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
            binary_suffix: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            binary_suffix: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
            binary_suffix: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Syncing version to $VERSION"

          # Patch Cargo.toml — perl works identically on GNU/Linux and BSD/macOS
          perl -i -pe "s/^version = \"[^\"]*\"/version = \"$VERSION\"/ if !\$done++" src-tauri/Cargo.toml

          # Patch tauri.conf.json — use jq for safe JSON manipulation
          tmp=$(mktemp)
          jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

          # Patch package.json — use jq for safe JSON manipulation
          tmp=$(mktemp)
          jq ".version = \"$VERSION\"" package.json > "$tmp" && mv "$tmp" package.json

          echo "Cargo.toml:       $(grep '^version' src-tauri/Cargo.toml | head -1)"
          echo "tauri.conf.json:  $(jq -r '.version' src-tauri/tauri.conf.json)"
          echo "package.json:     $(jq -r '.version' package.json)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Create binaries directory
        shell: bash
        run: mkdir -p src-tauri/binaries


      # Download yt-dlp
      - name: Download yt-dlp (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          curl -L -o "src-tauri/binaries/yt-dlp-${{ matrix.binary_suffix }}" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x "src-tauri/binaries/yt-dlp-${{ matrix.binary_suffix }}"

      - name: Download yt-dlp (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "src-tauri/binaries/yt-dlp-${{ matrix.binary_suffix }}.exe"

      - name: Download yt-dlp (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          curl -L -o "src-tauri/binaries/yt-dlp-${{ matrix.binary_suffix }}" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
          chmod +x "src-tauri/binaries/yt-dlp-${{ matrix.binary_suffix }}"

      # Download ffmpeg
      # Download ffmpeg
      - name: Download ffmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) MACOS_ARCH="arm64"; RELEASE_ARCH="arm64" ;;
            x86_64-apple-darwin) MACOS_ARCH="x64"; RELEASE_ARCH="amd64" ;;
            *) echo "Unsupported macOS target: ${{ matrix.target }}"; exit 1 ;;
          esac
          URLS=(
            "https://github.com/vanloctech/ffmpeg-macos/releases/latest/download/ffmpeg-macos-${MACOS_ARCH}.tar.gz"
          )
          OUTPUT="src-tauri/binaries/ffmpeg-${{ matrix.binary_suffix }}"
          FFPROBE_OUTPUT="src-tauri/binaries/ffprobe-${{ matrix.binary_suffix }}"
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT
          DOWNLOADED=0
          ATTEMPT=0
          for URL in "${URLS[@]}"; do
            echo "Attempting macOS ${MACOS_ARCH} ffmpeg download from ${URL}..."
            ATTEMPT_DIR="$TEMP_DIR/attempt-${ATTEMPT}"
            mkdir -p "$ATTEMPT_DIR"
            ATTEMPT=$((ATTEMPT + 1))
            if [[ "$URL" == *.tar.gz ]]; then
              if curl -fL --retry 3 --connect-timeout 20 -o "$ATTEMPT_DIR/ffmpeg.tar.gz" "$URL" && tar -xzf "$ATTEMPT_DIR/ffmpeg.tar.gz" -C "$ATTEMPT_DIR"; then
                FFMPEG_BIN=$(find "$ATTEMPT_DIR" -type f -name ffmpeg -perm -u+x | head -1)
                FFPROBE_BIN=$(find "$ATTEMPT_DIR" -type f -name ffprobe -perm -u+x | head -1)
                if [[ -n "$FFMPEG_BIN" && -n "$FFPROBE_BIN" ]]; then
                  cp "$FFMPEG_BIN" "$OUTPUT"
                  cp "$FFPROBE_BIN" "$FFPROBE_OUTPUT"
                  DOWNLOADED=1
                  break
                fi
              fi
            fi
          done
          if [[ $DOWNLOADED -ne 1 ]]; then
            echo "Error: Failed to download macOS ffmpeg from all mirrors"
            exit 1
          fi
          chmod +x "$OUTPUT"
          chmod +x "$FFPROBE_OUTPUT"

      - name: Download ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $TempDir = New-Item -ItemType Directory -Path "$env:TEMP\ffmpeg-dl" -Force
          $Urls = @(
            "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $Downloaded = $false
          foreach ($Url in $Urls) {
            try {
              Write-Host "Attempting ffmpeg download from $Url..."
              $ZipPath = "$TempDir\ffmpeg.zip"
              if (Test-Path $ZipPath) { Remove-Item $ZipPath -Force }
              Invoke-WebRequest -Uri $Url -OutFile $ZipPath -UseBasicParsing -TimeoutSec 180
              if (Test-Path $ZipPath) {
                $FileSize = (Get-Item $ZipPath).Length
                if ($FileSize -gt 10000000) {
                  Write-Host "Download successful ($([math]::Round($FileSize / 1MB, 2)) MB). Extracting..."
                  Expand-Archive -Path $ZipPath -DestinationPath $TempDir -Force
                  $FFmpegExe = Get-ChildItem -Path $TempDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
                  $FFprobeExe = Get-ChildItem -Path $TempDir -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
                  if ($FFmpegExe -and $FFprobeExe) {
                    Copy-Item -Path $FFmpegExe.FullName -Destination "src-tauri/binaries/ffmpeg-${{ matrix.binary_suffix }}.exe" -Force
                    Copy-Item -Path $FFprobeExe.FullName -Destination "src-tauri/binaries/ffprobe-${{ matrix.binary_suffix }}.exe" -Force
                    $Downloaded = $true
                    Write-Host "Successfully installed ffmpeg.exe from $Url"
                    break
                  }
                } else {
                  Write-Warning "File too small ($FileSize bytes), likely error page. Trying next mirror..."
                }
              }
            } catch {
              Write-Warning "Failed downloading from $($Url) - error: $($_.Exception.Message). Trying next fallback mirror..."
            }
          }
          Remove-Item -Path $TempDir -Recurse -Force -ErrorAction SilentlyContinue
          if (-not $Downloaded) {
            Write-Error "Failed to download ffmpeg from all mirrors."
            exit 1
          }

      - name: Download ffmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          URLS=(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          )
          DOWNLOADED=0
          for url in "${URLS[@]}"; do
            echo "Attempting Linux ffmpeg download from $url..."
            if curl -fL --retry 3 --connect-timeout 20 -o ffmpeg.tar.xz "$url"; then
              if tar -xf ffmpeg.tar.xz; then
                FFMPEG_BIN=$(find . -name "ffmpeg" -type f -executable | head -1)
                FFPROBE_BIN=$(find . -name "ffprobe" -type f -executable | head -1)
                if [[ -n "$FFMPEG_BIN" && -n "$FFPROBE_BIN" ]]; then
                  mv "$FFMPEG_BIN" "src-tauri/binaries/ffmpeg-${{ matrix.binary_suffix }}"
                  mv "$FFPROBE_BIN" "src-tauri/binaries/ffprobe-${{ matrix.binary_suffix }}"
                  chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.binary_suffix }}"
                  chmod +x "src-tauri/binaries/ffprobe-${{ matrix.binary_suffix }}"
                  rm -rf ffmpeg.tar.xz ffmpeg-*
                  DOWNLOADED=1
                  break
                fi
              fi
            fi
            echo "Mirror $url failed, trying next..."
            rm -rf ffmpeg.tar.xz ffmpeg-*
          done
          if [[ $DOWNLOADED -ne 1 ]]; then
            echo "Error: Failed to download ffmpeg from all mirrors"
            exit 1
          fi

      - name: List binaries
        run: ls -la src-tauri/binaries/
        shell: bash

      - name: Generate sidecar metadata
        shell: bash
        env:
          TOOL_TARGET: ${{ matrix.target }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          target = os.environ["TOOL_TARGET"]
          binaries = Path("src-tauri/binaries")
          suffix = ".exe" if target.endswith("windows-msvc") else ""
          tools = {
              "yt-dlp": ("--version",),
              "ffmpeg": ("-version",),
              "ffprobe": ("-version",),
          }
          entries = []

          for tool, version_args in tools.items():
              path = binaries / f"{tool}-{target}{suffix}"
              if not path.is_file():
                  raise SystemExit(f"Required sidecar is missing: {path}")
              result = subprocess.run(
                  [str(path), *version_args],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              first_line = result.stdout.splitlines()[0].strip()
              version = first_line if tool == "yt-dlp" else " ".join(first_line.split()[2:3])
              entries.append({
                  "tool": tool,
                  "target": target,
                  "asset_name": path.name,
                  "version": version,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
              })

          Path("toolchain-metadata.json").write_text(json.dumps({"tools": entries}, indent=2) + "\n")
          print(Path("toolchain-metadata.json").read_text())
          PY

      - name: Upload sidecars to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          RELEASE_ID=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | jq -r '.id')

          for sidecar in src-tauri/binaries/*; do
            filename=$(basename "$sidecar")
            existing_id=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              jq -r --arg name "$filename" '.[] | select(.name == $name) | .id')
            if [[ -n "$existing_id" && "$existing_id" != "null" ]]; then
              curl -fsSL -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$existing_id"
            fi
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$sidecar" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$filename"
          done

      - name: Upload toolchain metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: Toolchain-${{ matrix.name }}
          path: toolchain-metadata.json
          if-no-files-found: error

      - name: Debug signing key
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "✅ TAURI_SIGNING_PRIVATE_KEY is set"
            echo "Key length: ${#TAURI_SIGNING_PRIVATE_KEY}"
            echo "Key starts with: ${TAURI_SIGNING_PRIVATE_KEY:0:20}..."
          else
            echo "❌ TAURI_SIGNING_PRIVATE_KEY is NOT set or empty"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOWNLINK_GROQ_KEY: ${{ secrets.DOWNLINK_GROQ_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Downlink ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      - name: List generated signature files
        shell: bash
        run: |
          echo "Looking for .sig files..."
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.sig" -type f 2>/dev/null || echo "No sig files found"

      - name: Upload signature files to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          # Get release ID
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | jq -r '.id')

          echo "Release ID: $RELEASE_ID"

          # Find and upload all .sig files
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.sig" -type f | while read sig_file; do
            filename=$(basename "$sig_file")
            echo "Uploading $filename..."

            # Check if asset already exists and delete it
            EXISTING_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              jq -r ".[] | select(.name == \"$filename\") | .id")

            if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
              echo "Deleting existing asset $filename..."
              curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$EXISTING_ID"
            fi

            # Upload the sig file
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$sig_file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$filename"

            echo "Uploaded $filename"
          done

      - name: Upload binaries to workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Downlink-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: ignore

  # This job runs after all builds complete and generates the combined latest.json
  publish-updater:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | head -100

      - name: Get release assets
        id: get_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the release assets
          ASSETS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.get_version.outputs.tag }}")

          echo "$ASSETS" > release_assets.json

          VERSION="${{ steps.get_version.outputs.version }}"

          # Filter by version string first to avoid picking up stale old-version assets
          # from prior failed/partial builds that may coexist in the same release.
          MACOS_ARM64_URL=$(echo "$ASSETS" | jq -r --arg v "$VERSION" '.assets[] | select(.name | contains("aarch64") and contains(".app.tar.gz") and (contains(".sig") | not) and contains($v)) | .browser_download_url' | head -1)
          MACOS_ARM64_SIG_URL=$(echo "$ASSETS" | jq -r --arg v "$VERSION" '.assets[] | select(.name | contains("aarch64") and contains(".app.tar.gz.sig") and contains($v)) | .browser_download_url' | head -1)

          # macOS tar.gz filenames don't embed the version — fall back without version filter
          if [ -z "$MACOS_ARM64_URL" ] || [ "$MACOS_ARM64_URL" = "null" ]; then
            MACOS_ARM64_URL=$(echo "$ASSETS" | jq -r '.assets[] | select(.name | contains("aarch64") and contains(".app.tar.gz") and (contains(".sig") | not)) | .browser_download_url' | head -1)
            MACOS_ARM64_SIG_URL=$(echo "$ASSETS" | jq -r '.assets[] | select(.name | contains("aarch64") and contains(".app.tar.gz.sig")) | .browser_download_url' | head -1)
          fi

          MACOS_X64_URL=$(echo "$ASSETS" | jq -r --arg v "$VERSION" '.assets[] | select(.name | contains("x64") and contains(".app.tar.gz") and (contains(".sig") | not) and contains($v)) | .browser_download_url' | head -1)
          MACOS_X64_SIG_URL=$(echo "$ASSETS" | jq -r --arg v "$VERSION" '.assets[] | select(.name | contains("x64") and contains(".app.tar.gz.sig") and contains($v)) | .browser_download_url' | head -1)

          if [ -z "$MACOS_X64_URL" ] || [ "$MACOS_X64_URL" = "null" ]; then
            MACOS_X64_URL=$(echo "$ASSETS" | jq -r '.assets[] | select(.name | contains("x64") and contains(".app.tar.gz") and (contains(".sig") | not)) | .browser_download_url' | head -1)
            MACOS_X64_SIG_URL=$(echo "$ASSETS" | jq -r '.assets[] | select(.name | contains("x64") and contains(".app.tar.gz.sig")) | .browser_download_url' | head -1)
          fi

          WINDOWS_URL=$(echo "$ASSETS" | jq -r --arg v "$VERSION" '.assets[] | select(.name | contains("setup.exe") and (contains(".sig") | not) and contains($v)) | .browser_download_url' | head -1)
          WINDOWS_SIG_URL=$(echo "$ASSETS" | jq -r --arg v "$VERSION" '.assets[] | select(.name | contains("setup.exe.sig") and contains($v)) | .browser_download_url' | head -1)

          LINUX_URL=$(echo "$ASSETS" | jq -r --arg v "$VERSION" '.assets[] | select(.name | contains(".AppImage") and (contains(".sig") | not) and contains($v)) | .browser_download_url' | head -1)
          LINUX_SIG_URL=$(echo "$ASSETS" | jq -r --arg v "$VERSION" '.assets[] | select(.name | contains(".AppImage.sig") and contains($v)) | .browser_download_url' | head -1)

          echo "macos_arm64_url=$MACOS_ARM64_URL" >> $GITHUB_OUTPUT
          echo "macos_arm64_sig_url=$MACOS_ARM64_SIG_URL" >> $GITHUB_OUTPUT
          echo "macos_x64_url=$MACOS_X64_URL" >> $GITHUB_OUTPUT
          echo "macos_x64_sig_url=$MACOS_X64_SIG_URL" >> $GITHUB_OUTPUT
          echo "windows_url=$WINDOWS_URL" >> $GITHUB_OUTPUT
          echo "windows_sig_url=$WINDOWS_SIG_URL" >> $GITHUB_OUTPUT
          echo "linux_url=$LINUX_URL" >> $GITHUB_OUTPUT
          echo "linux_sig_url=$LINUX_SIG_URL" >> $GITHUB_OUTPUT

      - name: Download signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sigs

          # Download signature files if they exist
          if [ -n "${{ steps.get_assets.outputs.macos_arm64_sig_url }}" ] && [ "${{ steps.get_assets.outputs.macos_arm64_sig_url }}" != "null" ]; then
            curl -sL -H "Authorization: token $GITHUB_TOKEN" "${{ steps.get_assets.outputs.macos_arm64_sig_url }}" -o sigs/macos_arm64.sig
          fi

          if [ -n "${{ steps.get_assets.outputs.macos_x64_sig_url }}" ] && [ "${{ steps.get_assets.outputs.macos_x64_sig_url }}" != "null" ]; then
            curl -sL -H "Authorization: token $GITHUB_TOKEN" "${{ steps.get_assets.outputs.macos_x64_sig_url }}" -o sigs/macos_x64.sig
          fi

          if [ -n "${{ steps.get_assets.outputs.windows_sig_url }}" ] && [ "${{ steps.get_assets.outputs.windows_sig_url }}" != "null" ]; then
            curl -sL -H "Authorization: token $GITHUB_TOKEN" "${{ steps.get_assets.outputs.windows_sig_url }}" -o sigs/windows.sig
          fi

          if [ -n "${{ steps.get_assets.outputs.linux_sig_url }}" ] && [ "${{ steps.get_assets.outputs.linux_sig_url }}" != "null" ]; then
            curl -sL -H "Authorization: token $GITHUB_TOKEN" "${{ steps.get_assets.outputs.linux_sig_url }}" -o sigs/linux.sig
          fi

          ls -la sigs/ || echo "No signatures found"

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="See the changelog at https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.tag }}"

          # Read signatures (empty string if file doesn't exist)
          MACOS_ARM64_SIG=$(cat sigs/macos_arm64.sig 2>/dev/null || echo "")
          MACOS_X64_SIG=$(cat sigs/macos_x64.sig 2>/dev/null || echo "")
          WINDOWS_SIG=$(cat sigs/windows.sig 2>/dev/null || echo "")
          LINUX_SIG=$(cat sigs/linux.sig 2>/dev/null || echo "")

          # Create latest.json with all platforms
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "$NOTES",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$MACOS_ARM64_SIG",
                "url": "${{ steps.get_assets.outputs.macos_arm64_url }}"
              },
              "darwin-x86_64": {
                "signature": "$MACOS_X64_SIG",
                "url": "${{ steps.get_assets.outputs.macos_x64_url }}"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "${{ steps.get_assets.outputs.linux_url }}"
              },
              "windows-x86_64": {
                "signature": "$WINDOWS_SIG",
                "url": "${{ steps.get_assets.outputs.windows_url }}"
              }
            }
          }
          EOF

          # Pretty print and validate
          cat latest.json | jq .

      - name: Generate tools-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          entries = []
          for metadata_path in sorted(Path("artifacts").glob("Toolchain-*/toolchain-metadata.json")):
            entries.extend(json.loads(metadata_path.read_text())["tools"])

          expected_targets = {
            "aarch64-apple-darwin",
            "x86_64-apple-darwin",
            "x86_64-pc-windows-msvc",
            "x86_64-unknown-linux-gnu",
          }
          expected_tools = {"yt-dlp", "ffmpeg", "ffprobe"}
          actual = {(entry["target"], entry["tool"]) for entry in entries}
          missing = [
            f"{target}/{tool}"
            for target in sorted(expected_targets)
            for tool in sorted(expected_tools)
            if (target, tool) not in actual
          ]
          if missing:
            raise SystemExit("Missing sidecar metadata: " + ", ".join(missing))

          for entry in entries:
            entry["download_url"] = (
              "https://github.com/${{ github.repository }}/releases/latest/download/"
              + entry.pop("asset_name")
            )

          manifest = {
            "manifest_version": 1,
            "updated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
            "tools": sorted(entries, key=lambda entry: (entry["target"], entry["tool"])),
          }
          Path("tools-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          jq . tools-manifest.json

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the release ID
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.get_version.outputs.tag }}" | jq -r '.id')

          # Check if latest.json already exists and delete it
          EXISTING_ASSET_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
            jq -r '.[] | select(.name == "latest.json") | .id')

          if [ -n "$EXISTING_ASSET_ID" ] && [ "$EXISTING_ASSET_ID" != "null" ]; then
            echo "Deleting existing latest.json asset..."
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$EXISTING_ASSET_ID"
          fi

          # Upload latest.json
          echo "Uploading latest.json..."
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=latest.json"

          echo "latest.json uploaded successfully to release assets!"

      - name: Upload tools-manifest.json to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          RELEASE_ID=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | jq -r '.id')
          EXISTING_ASSET_ID=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
            jq -r '.[] | select(.name == "tools-manifest.json") | .id')
          if [[ -n "$EXISTING_ASSET_ID" && "$EXISTING_ASSET_ID" != "null" ]]; then
            curl -fsSL -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$EXISTING_ASSET_ID"
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @tools-manifest.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=tools-manifest.json"

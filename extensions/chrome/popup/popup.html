<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downlink Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Downlink</span>
          <span class="brand-sub">Companion Hub</span>
        </div>
      </div>
      <div class="status-pill" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Desktop Ready</span>
      </div>
    </header>

    <!-- Quick Action -->
    <section class="action-card">
      <div class="action-info">
        <span class="action-title" id="page-title">Current Tab Media</span>
        <span class="action-url" id="page-url">Loading active tab...</span>
      </div>
      <button class="btn-primary" id="btn-download-page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download in Downlink</span>
      </button>
    </section>

    <!-- Sniffed Streams Section -->
    <section class="streams-section">
      <div class="section-header">
        <span class="section-title">Detected Media Streams</span>
        <span class="stream-badge" id="stream-count">0</span>
      </div>
      <div class="stream-list" id="stream-list">
        <div class="empty-state">
          <span>No streaming video/audio detected yet on this page.</span>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn-secondary" id="btn-open-app">Open Desktop App</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>

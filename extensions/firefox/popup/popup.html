<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downlink Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="glass-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" class="brand-logo" alt="Downlink" width="30" height="30">
        <div class="brand-text">
          <span class="brand-title">Downlink</span>
          <span class="brand-subtitle">Desktop Companion</span>
        </div>
      </div>
      <div id="statusBadge" class="status-badge offline">
        <span class="status-dot"></span>
        <span id="statusText">Checking...</span>
      </div>
    </header>

    <!-- Active Tab Media Card -->
    <section class="active-tab-card">
      <div class="card-header">
        <span class="card-label">CURRENT TAB</span>
      </div>
      <div class="tab-info">
        <img id="tabFavicon" class="tab-favicon" src="../icons/icon16.png" alt="favicon">
        <div class="tab-meta">
          <div id="tabTitle" class="tab-title">Loading tab...</div>
          <div id="tabUrl" class="tab-url">https://...</div>
        </div>
      </div>
      <div class="preset-selector-group">
        <label for="presetSelect" class="preset-label">Format / Quality</label>
        <select id="presetSelect" class="preset-select">
          <option value="recommended_best">Best Quality (Up to 4K / 8K)</option>
          <option value="video_1080p">1080p Full HD</option>
          <option value="video_720p">720p HD</option>
          <option value="audio_mp3">Audio Only (MP3 320kbps)</option>
          <option value="audio_flac">Lossless Audio (FLAC)</option>
        </select>
      </div>
      <button id="downloadTabBtn" class="primary-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        <span>Download Active Media</span>
      </button>
    </section>

    <!-- Direct URL Input -->
    <section class="manual-input-section">
      <div class="input-wrap">
        <input type="text" id="manualUrlInput" placeholder="Or paste video / stream / playlist URL..." class="text-input" spellcheck="false">
        <button id="manualSendBtn" class="send-btn" title="Send to Downlink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </section>

    <!-- Quick Settings & Status Feedback -->
    <footer class="footer">
      <label class="toggle-control">
        <input type="checkbox" id="autoStartToggle" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">Auto-start download</span>
      </label>
      <div id="toastMessage" class="toast-message"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
